services:
  relay:
    image: lolping-relay:1.9.0
    build: .
    restart: unless-stopped
    init: true
    environment:
      TRUST_PROXY: "1"
      GALLERY_DIRECTORY: /data/gallery
      SESSION_DIRECTORY: /data/sessions
    expose: ["8787"]
    volumes:
      - gallery_data:/data/gallery
      - session_data:/data/sessions
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "28787:28787"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gallery_data:
  session_data:
  caddy_data:
  caddy_config:
