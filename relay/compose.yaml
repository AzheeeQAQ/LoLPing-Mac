services:
  relay:
    build: .
    restart: unless-stopped
    init: true
    environment:
      TRUST_PROXY: "1"
      GALLERY_DIRECTORY: /data/gallery
    expose:
      - "8787"
    volumes:
      - gallery_data:/data/gallery
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      PING_DOMAIN: ${PING_DOMAIN:?Set PING_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gallery_data:
  caddy_data:
  caddy_config:
